---
name: Run unit tests on framework engine
on:
  - push
  - pull_request
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Run main.sh config/link management tests
        run: bash tests/engine/test_main_conf_links.sh
      - name: Run bin/hardening.sh '--set-hardening-level' tests
        run: bash tests/engine/test_hardening_level.sh
