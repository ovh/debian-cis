# CIS Debian Hardening
# Main Configuration File, put here global variables

# Valid values are debug info ok warning error
LOGLEVEL=info

# Backup directory, every file modified by hardening will be backuped here, with versionning
# Means that if a file is modified more than once during the process, you will have hardening step diffs in the folder
BACKUPDIR="${CIS_TMP_DIR}/backups"
# Set to true to never run augenrules when applying audit rules: rules are still written in /etc/audit/rules.d,
# but /etc/audit/audit.rules is not regenerated (useful when it is managed by another tool)
# Can also be overridden in a script configuration file
DISABLE_AUGENRULES=false
