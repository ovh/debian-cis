---
name: Create Pre-Release
on:
  push:
    branches:
      - master
permissions:
  contents: read

# pre-release and release both recreate the "latest" tag: never run them concurrently
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Create Pre-Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # required to delete/create tags and releases, and upload assets
      contents: write
    steps:
      # CHECKOUT CODE
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # BUILD THE .DEB PACKAGE
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper
          sudo debuild --buildinfo-option=-O -us -uc -b -j8
          find ../ -name "*.deb" -exec mv {} cis-hardening.deb \;
      # DELETE THE TAG NAMED LATEST AND THE CORRESPONDING RELEASE
      - name: Delete the tag latest and the release latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
              gh release delete latest --cleanup-tag --yes
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/latest" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest"
          fi
      # GET LATEST VERSION TAG
      - name: Get latest version tag
        uses: actions-ecosystem/action-get-latest-tag@b7c32daec3395a9616f88548363a42652b22d435 # v1.6.0
        id: get-latest-tag
      # GENERATE CHANGELOG CORRESPONDING TO COMMIT BETWEEN HEAD AND COMPUTED LAST TAG
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@031a6408a9ad7fa6dcda49b7222ab2b54110a680 # v5.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{ github.sha }}
          base-ref: ${{ steps.get-latest-tag.outputs.tag }}
      # CREATE RELEASE NAMED LATEST AND UPLOAD PACKAGE .DEB
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          printf '%s\n' "$CHANGELOG" >changelog.md
          gh release create latest cis-hardening.deb \
              --target "$GITHUB_SHA" \
              --title Pre-release \
              --notes-file changelog.md \
              --prerelease
